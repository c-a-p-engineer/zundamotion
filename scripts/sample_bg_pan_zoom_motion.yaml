meta:
  title: "background pan/zoom multi-keyframe demo"
  version: 1

video:
  fps: 30

scenes:
  - id: bg_pan_zoom_motion
    bg: "assets/bg/room.png"
    lines:
      - wait: 2.0
        background_effects:
          - type: "bg:pan_zoom"
            zoom:
              from: 1.0
              to: 1.35
            pan:
              from: {x: 0.20, y: 0.50}
              to: {x: 0.75, y: 0.45}
            start: 0.10
            duration: 1.60
            easing: ease_in_out
            keyframes:
              - at: 0.45
                zoom: 1.12
                easing: ease_out
              - at: 1.00
                pan: {x: 0.55}
                zoom: 1.25
                easing: ease_in
