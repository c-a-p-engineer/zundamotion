meta:
  title: "キャラクター移動サンプル"
  version: 1

video:
  fps: 30

defaults:
  characters_persist: true
  characters:
    copetan:
      speaker_id: 3
      scale: 0.82
      anchor: bottom_center
      position: {x: -420, y: -32}
    engy:
      speaker_id: 8
      scale: 0.82
      anchor: bottom_center
      position: {x: 420, y: -32}

scenes:
  - id: character_move_showcase
    bg: "assets/bg/room.png"
    lines:
      - text: "キャラクターの位置を、発話中にすっと動かせるようになりました。"
        speaker_name: "copetan"
        characters:
          - name: "copetan"
            visible: true
            expression: "default"
            position: {x: -420, y: -32}
          - name: "engy"
            visible: true
            expression: "default"
            position: {x: 420, y: -32}
      - text: "position は移動後の位置。move.from からそこへ補間します。"
        speaker_name: "copetan"
        characters:
          - name: "copetan"
            position: {x: 0, y: -32}
            move:
              from: {x: -420, y: -32}
              duration: 0.8
              easing: ease_out
      - text: "characters_persist が有効なら、from を省略して前の位置から動けます。"
        speaker_name: "engy"
        characters:
          - name: "engy"
            position: {x: -120, y: -32}
            move:
              duration: 0.9
              easing: ease_in_out
      - text: "開始を少し遅らせたり、揺れと組み合わせたりもできます。"
        speaker_name: "copetan"
        characters:
          - name: "copetan"
            position: {x: -360, y: -32}
            move:
              duration: 0.7
              start: 0.2
              easing: ease_in
            effects:
              - type: "char:bob_char"
                amplitude: 8
                freq: 1.4
      - text: "座標を変えず、開始倍率だけ書けば、その場で拡大できます。"
        speaker_name: "engy"
        characters:
          - name: "engy"
            position: {x: -120, y: -32}
            scale: 1.0
            move:
              from: {scale: 0.55}
              duration: 0.8
              easing: ease_out
      - text: "開始座標と開始倍率を一緒に書けば、移動しながら拡大できます。"
        speaker_name: "copetan"
        characters:
          - name: "copetan"
            position: {x: 280, y: -32}
            scale: 1.05
            move:
              from: {x: -360, y: -32, scale: 0.6}
              duration: 1.0
              easing: ease_in_out
      - text: "途中の座標や倍率を keyframes で通過し、区間ごとに easing を変えられます。"
        speaker_name: "copetan"
        characters:
          - name: "copetan"
            position: {x: -40, y: -32}
            scale: 0.9
            move:
              from: {x: 280, y: -32, scale: 1.05}
              start: 0.1
              duration: 1.2
              easing: ease_in_out
              keyframes:
                - at: 0.3
                  x: 120
                  y: -90
                  easing: ease_out
                - at: 0.7
                  x: 20
                  scale: 1.18
                  easing: ease_in
      - text: "回転は anchor を支点にし、角度は次の行へ残しません。"
        speaker_name: "copetan"
        characters:
          - name: "copetan"
            rotate: 0
            move:
              from: {rotate: -8}
              duration: 1.0
              easing: ease_in_out
              keyframes:
                - at: 0.35
                  rotate: 12
                  easing: ease_out
                - at: 0.7
                  rotate: -4
                  easing: ease_in
      - text: "透明度は元画像の alpha を保ったまま乗算し、fade とも積で合成します。"
        speaker_name: "engy"
        characters:
          - name: "engy"
            opacity: 0.7
            enter: fade
            enter_duration: 0.4
            move:
              from: {opacity: 0.0}
              duration: 1.0
              easing: ease_out
              keyframes:
                - at: 0.45
                  opacity: 1.0
                  easing: ease_out
      - text: "pop preset は小さい状態から少し大きく跳ねて、元の大きさへ戻ります。"
        speaker_name: "copetan"
        characters:
          - name: "copetan"
            position: {x: -120, y: -32}
            scale: 0.9
            move:
              preset: pop
              intensity: 1.0
      - text: "bounce preset は最終位置を変えず、一度だけ上下に跳ねます。"
        speaker_name: "engy"
        characters:
          - name: "engy"
            position: {x: 120, y: -32}
            scale: 0.9
            move:
              preset: bounce
              intensity: 1.0
      - text: "emphasis preset はその場で一時的に拡大して強調します。"
        speaker_name: "copetan"
        characters:
          - name: "copetan"
            position: {x: 0, y: -32}
            scale: 0.9
            move:
              preset: emphasis
              intensity: 1.0
