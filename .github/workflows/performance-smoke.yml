name: Performance Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/performance-smoke.yml"
      - ".devcontainer/runtime.lock.json"
      - "tools/zundamotion_cold_warm_benchmark.py"
      - "tools/cpu_scene_fast_path_benchmark.py"
      - "tests/test_cold_warm_benchmark.py"
      - "scripts/smoke_minimal.yaml"
      - "scripts/benchmark_cpu_scene_fast_path.yaml"
      - "zundamotion/**"

jobs:
  cold-warm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_VERSION: "3.14.6"
      DISABLE_HWENC: "1"
      HW_FILTER_MODE: cpu
      USE_RAMDISK: "0"
      FFMPEG_STALL_TIMEOUT_SEC: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate runtime lock
        run: python3 scripts/check_runtime_lock.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates fontconfig fonts-ipafont-gothic
          fc-match IPAGothic

      - name: Install checksum-locked BtbN FFmpeg
        run: |
          sudo python scripts/install_locked_ffmpeg.py \
            --lock .devcontainer/runtime.lock.json \
            --prefix /opt/ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test benchmark helpers
        run: python -m pytest -q tests/test_cold_warm_benchmark.py

      - name: Compare one bounded CPU standard/fast pair
        run: |
          timeout 90s python tools/cpu_scene_fast_path_benchmark.py \
            --script scripts/benchmark_cpu_scene_fast_path.yaml \
            --output-dir output/benchmarks/cpu-scene-fast-path-ci \
            --runs 1

      - name: Upload CPU fast-path benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpu-scene-fast-path-python-${{ env.PYTHON_VERSION }}
          if-no-files-found: error
          retention-days: 14
          path: |
            output/benchmarks/cpu-scene-fast-path-ci/**
            output/perf/perf_summary*.json

      - name: Run fixed cold and warm renders
        run: |
          python tools/zundamotion_cold_warm_benchmark.py \
            scripts/smoke_minimal.yaml \
            --output-dir output/benchmarks/cold-warm-ci \
            --hw-encoder cpu \
            --quality speed \
            --jobs 1 \
            --no-voice

      - name: Upload performance benchmarks
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-python-${{ env.PYTHON_VERSION }}
          if-no-files-found: error
          retention-days: 14
          path: |
            output/benchmarks/cold-warm-ci/**
            output/benchmarks/cpu-scene-fast-path-ci/**
            output/perf/perf_summary*.json
