name: Issue 33 self apply

on:
  push:
    branches:
      - fix/issue-33-run-base-runtime
    paths:
      - .github/workflows/issue33-self-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-33-run-base-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply validated section patch
        run: python tools/apply_issue33_patch.py
      - name: Validate generated sources
        run: |
          git diff --check
          python -m py_compile \
            zundamotion/components/pipeline_phases/video_phase/scene_run_base_renderer.py \
            zundamotion/components/pipeline_phases/video_phase/scene_standard_renderer.py \
            zundamotion/components/pipeline_phases/video_phase/scene_renderer.py \
            tests/test_scene_run_base_renderer.py \
            tests/test_scene_renderer_module_split.py
          test "$(wc -l < zundamotion/components/pipeline_phases/video_phase/scene_standard_renderer.py)" -lt 950
          ! grep -q "talk_lines2" zundamotion/components/pipeline_phases/video_phase/scene_standard_renderer.py
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: connect original-index Run Base runtime"
          git push origin HEAD:fix/issue-33-run-base-runtime
