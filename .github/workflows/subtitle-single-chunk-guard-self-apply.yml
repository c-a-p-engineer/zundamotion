name: Subtitle single chunk guard self apply
on:
  push:
    branches: [refactor/issue-40-subtitle-executor]
    paths: [.github/workflows/subtitle-single-chunk-guard-self-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/issue-40-subtitle-executor
          fetch-depth: 0
      - run: python tools/apply_subtitle_single_chunk_guard.py
      - run: |
          git diff --check
          python -m py_compile zundamotion/components/video/overlays.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep single subtitle chunk on stable full burn"
          git push origin HEAD:refactor/issue-40-subtitle-executor
