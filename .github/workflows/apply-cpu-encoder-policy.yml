name: Apply CPU Encoder Policy Patch

on:
  pull_request:
    paths:
      - ".github/workflows/apply-cpu-encoder-policy.yml"
      - "tools/apply_cpu_encoder_policy_patch.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_cpu_encoder_policy_patch.py

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run targeted tests
        run: |
          python -m compileall -q zundamotion tests
          python -m pytest -q tests/test_cpu_encoder_policy.py

      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve CPU encoder policy during normalization"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
