name: Standard orchestration self apply

on:
  push:
    branches:
      - refactor/issue-39-standard-orchestration
    paths:
      - .github/workflows/standard-orchestration-self-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-39-standard-orchestration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply facade and characterization patch
        run: python tools/apply_standard_orchestration_patch.py
      - name: Validate generated sources
        run: |
          git diff --check
          python -m py_compile \
            zundamotion/components/pipeline_phases/video_phase/scene_standard_context.py \
            zundamotion/components/pipeline_phases/video_phase/scene_precache.py \
            zundamotion/components/pipeline_phases/video_phase/scene_line_pipeline.py \
            zundamotion/components/pipeline_phases/video_phase/scene_standard_renderer.py \
            zundamotion/components/pipeline_phases/video_phase/scene_renderer.py \
            tests/test_scene_standard_context.py \
            tests/test_scene_standard_orchestration.py \
            tests/test_scene_renderer_module_split.py
          test "$(wc -l < zundamotion/components/pipeline_phases/video_phase/scene_standard_renderer.py)" -lt 100
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: connect standard render stages"
          git push origin HEAD:refactor/issue-39-standard-orchestration
