name: Subtitle plan self apply

on:
  push:
    branches:
      - refactor/issue-40-subtitle-plan
    paths:
      - .github/workflows/subtitle-plan-self-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/issue-40-subtitle-plan
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - name: Apply subtitle segment planner integration
        run: python tools/apply_subtitle_segment_plan_patch.py
      - name: Validate generated sources
        run: |
          git diff --check
          python -m py_compile \
            zundamotion/components/video/subtitle_segment_plan.py \
            zundamotion/components/video/overlays.py \
            tests/test_subtitle_segment_plan.py \
            tests/test_subtitle_tail_safety.py
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: connect pure subtitle segment planner"
          git push origin HEAD:refactor/issue-40-subtitle-plan
