name: Subtitle executor self apply

on:
  push:
    branches:
      - refactor/issue-40-subtitle-executor
    paths:
      - .github/workflows/subtitle-executor-self-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/issue-40-subtitle-executor
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - name: Apply bounded subtitle executor integration
        run: python tools/apply_subtitle_executor_patch.py
      - name: Validate generated sources
        run: |
          git diff --check
          python -m py_compile \
            zundamotion/components/video/subtitle_segment_executor.py \
            zundamotion/components/video/subtitle_video_segments.py \
            zundamotion/components/video/overlays.py \
            zundamotion/components/video/__init__.py \
            tests/test_subtitle_segment_executor.py \
            tests/test_subtitle_video_segments.py
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect bounded subtitle segment pipeline"
          git push origin HEAD:refactor/issue-40-subtitle-executor
