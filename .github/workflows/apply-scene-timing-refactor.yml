name: Apply scene timing refactor

on:
  push:
    branches:
      - agent/scene-timing-plan
    paths:
      - tools/apply_scene_timing_refactor.py
      - .github/workflows/apply-scene-timing-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/scene-timing-plan
          fetch-depth: 0

      - name: Apply refactor
        run: python3 tools/apply_scene_timing_refactor.py

      - name: Validate syntax and diff
        run: |
          python3 -m compileall -q zundamotion tests
          git diff --check

      - name: Remove one-shot tooling and publish result
        run: |
          rm tools/apply_scene_timing_refactor.py
          rm .github/workflows/apply-scene-timing-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(video): extract scene timing plan"
          git push origin HEAD:agent/scene-timing-plan
