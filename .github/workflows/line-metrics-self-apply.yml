name: Line metrics self apply

on:
  push:
    branches:
      - refactor/issue-39-line-metrics
    paths:
      - .github/workflows/line-metrics-self-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-39-line-metrics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply validated section patch
        run: python tools/apply_line_metrics_patch.py
      - name: Validate generated sources
        run: |
          git diff --check
          python -m py_compile \
            zundamotion/components/pipeline_phases/video_phase/scene_line_metrics.py \
            zundamotion/components/pipeline_phases/video_phase/scene_standard_renderer.py \
            zundamotion/components/pipeline_phases/video_phase/scene_renderer.py \
            tests/test_scene_line_metrics.py \
            tests/test_scene_renderer_module_split.py
          test "$(wc -l < zundamotion/components/pipeline_phases/video_phase/scene_standard_renderer.py)" -lt 500
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract line metrics and auto-tune"
          git push origin HEAD:refactor/issue-39-line-metrics
