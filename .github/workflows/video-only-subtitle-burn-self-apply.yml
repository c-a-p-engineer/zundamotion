name: Video-only subtitle burn self apply

on:
  push:
    branches:
      - refactor/issue-40-video-only-segments
    paths:
      - .github/workflows/video-only-subtitle-burn-self-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/issue-40-video-only-segments
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - name: Apply explicit video-only subtitle burn mode
        run: python tools/apply_video_only_subtitle_burn_patch.py
      - name: Validate generated sources
        run: |
          git diff --check
          python -m py_compile \
            zundamotion/components/video/subtitle_video_segments.py \
            zundamotion/components/video/overlays.py \
            zundamotion/components/video/__init__.py \
            tests/test_subtitle_video_segments.py
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add explicit video-only subtitle burn mode"
          git push origin HEAD:refactor/issue-40-video-only-segments
